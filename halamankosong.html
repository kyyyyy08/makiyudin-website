<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalam Pembuatan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    overflow:hidden;
    position:relative;
}

/* Background Blur */
body::before,
body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(120px);
}

body::before{
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

body::after{
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
}

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:700px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    padding:60px 40px;
    text-align:center;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.icon{
    font-size:90px;
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

h1{
    font-size:2.3rem;
    margin-bottom:15px;
    font-weight:700;
}

p{
    color:#cbd5e1;
    line-height:1.8;
    margin-bottom:30px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    background:rgba(255,255,255,.1);
    border-radius:50px;
    border:1px solid rgba(255,255,255,.1);
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    animation:pulse 1.5s infinite;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 30px;
    text-decoration:none;
    color:white;
    font-weight:600;
    border-radius:50px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(59,130,246,.4);
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.5);}
    100%{transform:scale(1);}
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

@media(max-width:600px){
    h1{
        font-size:1.8rem;
    }

    .card{
        padding:45px 25px;
    }

    .icon{
        font-size:70px;
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="icon">🚧</div>

        <h1>Halaman Sedang Dalam Tahap Pengembangan</h1>

        <p>
            Maaf, halaman yang Anda tuju saat ini masih dalam tahap
            pengembangan. Kami sedang mempersiapkan sesuatu yang lebih baik
            dan akan segera tersedia untuk Anda.
        </p>

        <div class="status">
            <span class="dot"></span>
            <span>Development In Progress</span>
        </div>

        <br>

        <a href="index.html" class="btn">
            Kembali ke Beranda
        </a>
    </div>
</div>

</body>
</html>
